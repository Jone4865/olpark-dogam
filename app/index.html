<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올팍 도감</title>

<meta name="theme-color" content="#22663F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="올팍 도감">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="주요 메뉴" hidden>
    <a href="#/map" data-tab="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>지도</a>
    <a href="#/book" data-tab="book">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>도감</a>
    <a href="#/badges" data-tab="badges">

</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="restore-file" type="file" accept="application/json,.json" hidden>
<noscript><p style="padding:24px">올팍 도감은 자바스크립트를 켜야 쓸 수 있어요.</p></noscript>
<script type="module" src="app.js"></script>

</html>
